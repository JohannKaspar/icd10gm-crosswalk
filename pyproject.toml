[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "icd10gm-crosswalk"
version = "0.1.0"
description = "Crosswalk ICD-10-GM codes across annual editions using official BfArM transition tables."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JohannKaspar", email = "63501587+JohannKaspar@users.noreply.github.com" }]
keywords = [
    "icd-10-gm",
    "icd10",
    "bfarm",
    "umsteiger",
    "crosswalk",
    "medical-coding",
    "clinical-nlp",
    "germany",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JohannKaspar/icd10gm-crosswalk"
Repository = "https://github.com/JohannKaspar/icd10gm-crosswalk"
Issues = "https://github.com/JohannKaspar/icd10gm-crosswalk/issues"
Changelog = "https://github.com/JohannKaspar/icd10gm-crosswalk/blob/main/CHANGELOG.md"

[project.scripts]
icd10gm-crosswalk = "icd10gm_crosswalk.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "ty>=0.0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/icd10gm_crosswalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "S"]
ignore = ["PLR2004", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
# asserts are the point in tests; parametrized tests legitimately take many args
"tests/**" = ["S101", "PLR0913"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"
